<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musical Zoo</title>
    <meta
      name="description"
      content="A colourful zoo scene with eight cute animals, arranged from smallest to largest."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>

    <main class="zoo">
      <div class="sky" aria-hidden="true">
        <div class="sun"></div>
        <div class="cloud cloud--1"></div>
        <div class="cloud cloud--2"></div>
        <div class="tree tree--1"></div>
        <div class="tree tree--2"></div>
        <div class="tree tree--3"></div>
        <div class="tree tree--4"></div>
      </div>

      <div class="grass">
        <div class="gate" aria-hidden="true">
          <svg class="gate-arch" viewBox="0 0 800 560" preserveAspectRatio="xMidYMax meet">
            <line x1="0" y1="490" x2="160" y2="490" class="fence-rail" />
            <line x1="0" y1="520" x2="160" y2="520" class="fence-rail" />
            <line x1="10" y1="470" x2="10" y2="540" class="fence-post" />
            <line x1="45" y1="470" x2="45" y2="540" class="fence-post" />
            <line x1="80" y1="470" x2="80" y2="540" class="fence-post" />
            <line x1="115" y1="470" x2="115" y2="540" class="fence-post" />
            <line x1="150" y1="470" x2="150" y2="540" class="fence-post" />

            <line x1="640" y1="490" x2="800" y2="490" class="fence-rail" />
            <line x1="640" y1="520" x2="800" y2="520" class="fence-rail" />
            <line x1="650" y1="470" x2="650" y2="540" class="fence-post" />
            <line x1="685" y1="470" x2="685" y2="540" class="fence-post" />
            <line x1="720" y1="470" x2="720" y2="540" class="fence-post" />
            <line x1="755" y1="470" x2="755" y2="540" class="fence-post" />
            <line x1="790" y1="470" x2="790" y2="540" class="fence-post" />

            <path d="M190 230 A210 210 0 0 1 610 230" class="arch-outline" />
            <path d="M190 230 A210 210 0 0 1 610 230" class="arch-band" />
            <path d="M190 230 A210 210 0 0 1 610 230" class="arch-highlight" />

            <rect x="160" y="230" width="60" height="310" rx="10" class="pillar" />
            <rect x="580" y="230" width="60" height="310" rx="10" class="pillar" />
            <line x1="180" y1="244" x2="180" y2="534" class="pillar-groove" />
            <line x1="600" y1="244" x2="600" y2="534" class="pillar-groove" />
          </svg>
          <div class="gate-sign">
            <h1>MUSICAL ZOO</h1>
          </div>
        </div>

        <ul class="animal-row">
          <li class="animal animal--chick">
            <span class="animal-note">Do</span>
            <img src="./animals/chick.png" alt="Chicks" />
          </li>
          <li class="animal animal--rabbit">
            <span class="animal-note">Re</span>
            <img src="./animals/rabbit.png" alt="Rabbit" />
          </li>
          <li class="animal animal--cat">
            <span class="animal-note">Mi</span>
            <img src="./animals/cat.png" alt="Cat" />
          </li>
          <li class="animal animal--dog">
            <span class="animal-note">Fa</span>
            <img src="./animals/dog.png" alt="Dog" />
          </li>
          <li class="row-break" aria-hidden="true"></li>
          <li class="animal animal--sheep">
            <span class="animal-note">Sol</span>
            <img src="./animals/sheep.png" alt="Sheep" />
          </li>
          <li class="animal animal--lion">
            <span class="animal-note">La</span>
            <img src="./animals/lion.png" alt="Lion" />
          </li>
          <li class="animal animal--elephant">
            <span class="animal-note">Si</span>
            <img src="./animals/elephant.png" alt="Elephant" />
          </li>
          <li class="animal animal--giraffe">
            <span class="animal-note">High Do</span>
            <img src="./animals/giraffe.png" alt="Giraffe" />
          </li>
        </ul>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
